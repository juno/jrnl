version: 2
updates:
- package-ecosystem: "bundler"
  directory: "/"
  schedule:
    interval: "daily"
    time: "07:00"
    timezone: "Asia/Tokyo"
  cooldown:
    default-days: 3
  groups:
    rspec-dependencies:
      patterns:
        - "rspec"
        - "rspec-*"
        - "rspec_*"
    rubocop-dependencies:
      patterns:
        - "rubocop"
        - "rubocop-*"
# - package-ecosystem: "npm"
#   directory: "/"
#   schedule:
#     interval: "weekly"
#     day: "saturday"
#     timezone: "Asia/Tokyo"
#   open-pull-requests-limit: 10
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "daily"
    time: "07:00"
    timezone: "Asia/Tokyo"
  cooldown:
    default-days: 3
